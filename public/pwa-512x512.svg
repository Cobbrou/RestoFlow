<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26201B"/>
      <stop offset="100%" stop-color="#14110E"/>
    </linearGradient>
    <linearGradient id="rf-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26E3A"/>
      <stop offset="100%" stop-color="#C1440E"/>
    </linearGradient>
    <linearGradient id="rf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="100%" stop-color="#D99B26"/>
    </linearGradient>
    <filter id="rf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#rf-bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#C1440E" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Glowing background orb -->
  <circle cx="256" cy="256" r="160" fill="url(#rf-primary)" opacity="0.12" filter="blur(30px)"/>

  <!-- Plate base -->
  <g filter="url(#rf-shadow)">
    <!-- Outer rim -->
    <circle cx="256" cy="256" r="168" fill="#1C1814" stroke="url(#rf-primary)" stroke-width="8"/>
    <!-- Inner rim -->
    <circle cx="256" cy="256" r="136" fill="#241E1A" stroke="#5B5346" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- Center plate surface -->
    <circle cx="256" cy="256" r="108" fill="url(#rf-bg)"/>

    <!-- Fork (Left) -->
    <g transform="translate(196, 256)">
      <!-- Handle -->
      <path d="M-6,70 L-2,-10 C-2,-20 -10,-28 -10,-48 L-10,-60 C-10,-63 -7,-65 -4,-65 C-1,-65 2,-63 2,-60 L2,-38 C2,-36 4,-34 6,-34 C8,-34 10,-36 10,-38 L10,-60 C10,-63 13,-65 16,-65 C19,-65 22,-63 22,-60 L22,-48 C22,-28 14,-20 14,-10 L18,70 C18,76 13,80 6,80 C-1,80 -6,76 -6,70 Z" fill="url(#rf-gold)" opacity="0.95"/>
    </g>

    <!-- Knife (Right) -->
    <g transform="translate(304, 256)">
      <!-- Blade & Handle -->
      <path d="M-6,70 L-2,0 C-2,-20 12,-45 16,-72 C16.5,-75 14,-78 11,-77 C2,-74 -14,-45 -14,0 L-10,70 C-10,76 -5,80 -2,80 C1,80 6,76 6,70 Z" fill="url(#rf-gold)" opacity="0.95"/>
    </g>

    <!-- Center Cloche accent -->
    <path d="M256,195 C232,195 214,212 212,236 L300,236 C298,212 280,195 256,195 Z" fill="url(#rf-primary)"/>
    <circle cx="256" cy="188" r="7" fill="url(#rf-gold)"/>
    <rect x="206" y="238" width="100" height="6" rx="3" fill="url(#rf-gold)"/>
  </g>

  <!-- Status / sync dot indicator (representing realtime flow) -->
  <circle cx="372" cy="140" r="22" fill="#10B981" stroke="#1E1A17" stroke-width="6"/>
  <path d="M366,140 L370,144 L378,136" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
